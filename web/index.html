<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="enola">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>enola</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="debug-status" style="position:fixed;top:0;left:0;right:0;background:red;color:white;padding:10px;font-size:14px;z-index:99999;font-family:monospace;">
    Loading...
  </div>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <script>
    document.getElementById('debug-status').innerText = 'HTML loaded, waiting for bootstrap...';
    window.addEventListener('error', function(e) {
      document.getElementById('debug-status').innerText = 'JS ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno;
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.getElementById('debug-status').innerText = 'PROMISE REJECTED: ' + e.reason;
    });
  </script>

  <script type="application/javascript" src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js"></script>
  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
