name: Flutter Web Build & Deploy

on:
  workflow_dispatch:   # manual trigger
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          cache: true # Ottimizza i tempi di esecuzione

      - name: Clean
        run: flutter clean

      - name: Enable Web
        run: flutter config --enable-web

      - name: Install dependencies
        run: |
          flutter pub get
          # This ensures the generator itself is up to date in the runner environment
          flutter pub upgrade isar_generator 

      - name: Clean and Generate
        run: |
          # 1. Force remove any local .g.dart that might have leaked in
          rm -f lib/models/*.g.dart
          # 2. Clear the build cache entirely
          flutter clean
          # 3. Generate fresh code specifically for the Web target
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Web
        run: |
          # We use --release and force the renderer to ensure JS compatibility
          flutter build web --release --web-renderer canvaskit




      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
