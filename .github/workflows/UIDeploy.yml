name: Flutter Web Build & Deploy

on:
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable Profile Mode & Source Maps (For iPad Debugging)'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Clean and Generate Code
        run: |
          flutter clean
          dart run build_runner build --delete-conflicting-outputs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f lib/database/database.g.dart ]; then
            git add lib/database/database.g.dart
          fi
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: update generated drift files [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes detected in generated files. Skipping commit."
          fi

      - name: Build Web
        run: |
          # Default to standard release options
          BUILD_FLAGS="--release"
          
          # If the user ticked the debug checkbox, switch to profile mode with source maps
          if [ "${{ github.event.inputs.debug_mode }}" = "true" ]; then
            echo "🔧 Building in PROFILE mode with SOURCE MAPS enabled..."
            BUILD_FLAGS="--profile --source-maps"
          fi

          flutter build web $BUILD_FLAGS --no-wasm-dry-run --base-href "/${{ github.event.repository.name }}/" --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

          # Force the bootstrap script to ignore WASM
          if [ -f build/web/flutter_bootstrap.js ]; then
            sed -i 's/engineConfiguration: {/engineConfiguration: { useWasm: false,/g' build/web/flutter_bootstrap.js
          fi

          # Cleanup and Jekyll fix
          rm -f build/web/main.dart.wasm
          touch build/web/.nojekyll
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
