name: Flutter Web Build & Deploy

on:
  workflow_dispatch:   # manual trigger
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          # 1. Force the generator to the latest web-safe version
          flutter pub upgrade isar_generator 

      - name: Clean and Generate Code
        run: |
          # 2. Delete any existing .g.dart files that might be in the repo
          rm -f lib/models/*.g.dart
          # 3. Wipe the build cache
          flutter clean
          # 4. Generate fresh, web-compatible code on the runner
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Web
        run: |
          # 5. Build using the canvaskit renderer for better stability with Isar
          flutter build web --release --web-renderer canvaskit

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
