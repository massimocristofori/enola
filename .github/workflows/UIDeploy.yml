name: Flutter Web Build & Deploy

on:
  workflow_dispatch:   # manual trigger
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Clean and Generate Code
        run: |
          # 1. Clean build artifacts
          flutter clean
          # 2. Generate Drift database and Riverpod code
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Web
        run: |
          # 1. Build
          flutter build web --release --base-href /${{ github.event.repository.name }}/

          # 2. THE FIX: Force the bootstrap script to ignore WASM
          # This finds the configuration logic and injects useWasm: false
          sed -i 's/engineConfiguration: {/engineConfiguration: { useWasm: false,/g' build/web/flutter_bootstrap.js

          # 3. Cleanup to be safe
          rm -f build/web/main.dart.wasm
          touch build/web/.nojekyll

          
      - name: Disable Jekyll
        run: touch build/web/.nojekyll




      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
