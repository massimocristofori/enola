name: Flutter Web Build & Deploy

on:
  workflow_dispatch:   # manual trigger
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Clean and Generate Code
        run: |
          # 1. Clean build artifacts
          flutter clean
          # 2. Generate Drift database and Riverpod code
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Web
        run: |
          # 1. Build using 'dart-define' to bypass the picky CLI flags
          flutter build web --release --base-href /${{ github.event.repository.name }}/ --dart-define=FLUTTER_WEB_RENDERER=canvakit

          # 2. The "Nuclear Option": Remove the WASM file manually
          # If this file exists, the browser tries to load it and fails due to GH Pages MIME types.
          # If we delete it, Flutter automatically falls back to JS safely.
          rm -f build/web/main.dart.wasm
          
      - name: Disable Jekyll
        run: touch build/web/.nojekyll




      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
