name: enola
description: A riddle map game for students — scan, learn, play.
publish_to: 'none'
version: 3.0.0+264

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database (Drift/SQLite)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.3

  # OCR & AI
  google_mlkit_text_recognition: ^0.14.0
  google_generative_ai: ^0.4.7

  # Camera & image
  image_picker: ^1.1.2
  camera: ^0.12.0+1

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  collection: ^1.18.0

  # UI & Animation
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  
  # Generators
  riverpod_generator: ^2.4.0
  drift_dev: ^2.20.0
  
  # Quality Assurance
  analyzer: ^5.13.0
  custom_lint: ^0.6.4
  
  # Assets
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
